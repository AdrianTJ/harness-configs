name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        run: shellcheck -S warning install.sh scripts/check-manifest.sh

      - name: syntax
        run: bash -n install.sh && bash -n scripts/check-manifest.sh

      - name: manifest structure
        run: bash scripts/check-manifest.sh

      - name: skills and evals structure
        run: python3 scripts/validate-skills.py

      - name: install smoke test
        run: ./install.sh --dry-run && ./install.sh --status

      - name: unknown harness rejected
        run: |
          if ./install.sh --harness bogus --status; then
            echo "expected --harness bogus to fail" >&2
            exit 1
          fi
