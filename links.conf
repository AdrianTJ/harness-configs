# Symlink manifest for install.sh
#
# Format:  <harness>  <mode>  <source>  <target>
#
#   harness   Tag used by `--harness NAME` to filter. Also groups the output.
#   mode      link  = symlink <source> to <target> exactly (file or directory).
#             merge = for each entry inside <source>/, symlink it into <target>/.
#                     Use this whenever more than one source feeds one directory,
#                     or the harness also writes its own files there.
#   source    Path relative to this repo.
#   target    Absolute path. $HOME and $XDG_CONFIG_HOME are expanded.
#
# Entries whose source does not exist are skipped, not errors. The manifest
# describes the full intended surface; populate it as you go.
#
# Deliberately NOT linked, because harnesses write secrets and state there:
#   ~/.pi/agent/{sessions/,trust.json,auth.json,models.json,git/,npm/}
#   ~/.claude/.credentials.json  ~/.claude/history.jsonl  ~/.claude/projects/
#   ~/.codex/auth.json
#   ~/.config/herdr/{session.json,herdr.log,plugins/}  ~/.herdr/worktrees/

# ---------------------------------------------------------------- pi
# Config root: ~/.pi/agent   (project-level equivalent is .pi/)
pi          link   pi/settings.json          $HOME/.pi/agent/settings.json
pi          link   pi/keybindings.json       $HOME/.pi/agent/keybindings.json
pi          link   shared/AGENTS.md          $HOME/.pi/agent/AGENTS.md
pi          link   pi/APPEND_SYSTEM.md       $HOME/.pi/agent/APPEND_SYSTEM.md
pi          merge  pi/extensions             $HOME/.pi/agent/extensions
pi          merge  pi/themes                 $HOME/.pi/agent/themes
pi          merge  shared/skills             $HOME/.pi/agent/skills
pi          merge  pi/skills                 $HOME/.pi/agent/skills
pi          merge  shared/prompts            $HOME/.pi/agent/prompts
pi          merge  pi/prompts                $HOME/.pi/agent/prompts

# ---------------------------------------------------------- claude-code
# Config root: ~/.claude   (project-level equivalent is .claude/)
# CLAUDE.md is a symlink to the shared AGENTS.md every other harness reads.
claude-code link   claude-code/settings.json $HOME/.claude/settings.json
claude-code link   shared/AGENTS.md          $HOME/.claude/CLAUDE.md
claude-code merge  claude-code/agents        $HOME/.claude/agents
claude-code merge  claude-code/commands      $HOME/.claude/commands
claude-code merge  shared/skills             $HOME/.claude/skills
claude-code merge  claude-code/skills        $HOME/.claude/skills

# ------------------------------------------------------------- codex
# Config root: ~/.codex
codex       link   codex/config.toml         $HOME/.codex/config.toml
codex       link   shared/AGENTS.md          $HOME/.codex/AGENTS.md
codex       merge  shared/prompts            $HOME/.codex/prompts
codex       merge  codex/prompts             $HOME/.codex/prompts

# ---------------------------------------------------------- opencode
# Config root: $XDG_CONFIG_HOME/opencode
opencode    link   opencode/opencode.json    $XDG_CONFIG_HOME/opencode/opencode.json
opencode    link   shared/AGENTS.md          $XDG_CONFIG_HOME/opencode/AGENTS.md
opencode    merge  opencode/agent            $XDG_CONFIG_HOME/opencode/agent
opencode    merge  opencode/command          $XDG_CONFIG_HOME/opencode/command
opencode    merge  opencode/plugin           $XDG_CONFIG_HOME/opencode/plugin

# ------------------------------------------------------------- herdr
# Config root: $XDG_CONFIG_HOME/herdr  (confirmed by `herdr --default-config`)
#
# scripts/ and sounds/ exist because config.toml resolves relative paths against
# "this config file's directory" -- [ui.sound] path = "sounds/notification.mp3",
# and [[keys.command]] entries that shell out to a helper. Linking them next to
# the linked config.toml means those relative paths resolve whether or not herdr
# canonicalises the symlink first.
#
# NOT linked: plugins/ is installed and managed by herdr itself; session.json,
# herdr.log, and the socket are runtime state; worktrees live in ~/.herdr/.
herdr       link   herdr/config.toml         $XDG_CONFIG_HOME/herdr/config.toml
herdr       merge  herdr/scripts             $XDG_CONFIG_HOME/herdr/scripts
herdr       merge  herdr/sounds              $XDG_CONFIG_HOME/herdr/sounds
